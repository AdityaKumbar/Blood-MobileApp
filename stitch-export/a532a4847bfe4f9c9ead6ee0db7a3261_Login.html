<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col items-center">
<!-- Top AppBar (Simplified for Login as per Task-Focused rule) -->
<header class="w-full h-16 flex items-center justify-center px-margin-mobile md:px-margin-desktop sticky top-0 z-50 bg-surface">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="bloodtype">bloodtype</span>
<span class="font-headline-md text-headline-md font-extrabold text-primary tracking-tight">LifeFlow</span>
</div>
</header>
<main class="flex-1 flex flex-col items-center justify-center w-full max-w-lg px-margin-mobile py-lg">
<!-- Welcome Section -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xs">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Log in to continue saving lives.</p>
</div>
<!-- Login Form Card -->
<div class="w-full bg-surface-container-lowest login-card-shadow rounded-xl p-lg border border-outline-variant">
<form class="flex flex-col gap-gutter" id="loginForm">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email Address or Phone Number</label>
<div class="relative group">
<input class="w-full h-12 px-md py-sm bg-surface-container-lowest border border-outline-variant rounded-xl focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all placeholder:text-outline/50 font-body-md text-body-md" id="email" name="email" placeholder="name@example.com" required="" type="text">
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant/70 hover:text-primary transition-colors cursor-default" data-icon="person" style="opacity: 0;">person</span>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-secondary hover:text-secondary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<input class="w-full h-12 px-md py-sm bg-surface-container-lowest border border-outline-variant rounded-xl focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all placeholder:text-outline/50 font-body-md text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="passwordToggleIcon">visibility</span>
</button>
</div>
</div>
<!-- Primary Login Button -->
<button class="mt-sm h-12 w-full bg-primary text-on-primary font-button text-button rounded-full shadow-md hover:bg-primary-container transition-all btn-active-state flex items-center justify-center gap-sm" type="submit">
                    Login
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->

<!-- Social Login Options -->

</div>

<p class="font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account?

</p>

<p class="font-body-sm text-body-sm text-white/90">Join thousands of donors making a difference in the community every day.</p>

<script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('passwordToggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.innerText = 'visibility';
            }
        }

        // Simple form interaction
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Visual feedback
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Logging in...`;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                alert('Success! Redirecting to dashboard...');
            }, 1500);
        });

        // Add floating effect to background blobs
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            const blobs = document.querySelectorAll('.fixed.-z-10 div');
            blobs.forEach((blob, index) => {
                const speed = (index + 1) * 20;
                blob.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
    </script>

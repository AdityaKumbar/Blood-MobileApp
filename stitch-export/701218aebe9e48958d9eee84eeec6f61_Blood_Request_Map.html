<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>LifeStream | Map View</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
            font-variation-settings: 'FILL' 1;
        }
        /* Custom map pin bounce animation */
        @keyframes pinBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-pin {
            animation: pinBounce 2s ease-in-out infinite;
        }
        /* Smooth bottom sheet transition */
        #bottom-sheet {
            transition: transform 0.4s cubic-bezier(0.33, 1, 0.68, 1);
        }
        .sheet-hidden {
            transform: translateY(100%);
        }
        .sheet-visible {
            transform: translateY(0);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#d5e3ff",
                        "error-container": "#ffdad6",
                        "secondary-container": "#a3d8fe",
                        "tertiary-fixed-dim": "#9ecfd1",
                        "on-tertiary-fixed-variant": "#1a4e50",
                        "on-tertiary-fixed": "#002021",
                        "tertiary": "#336366",
                        "primary-container": "#db313f",
                        "primary-fixed-dim": "#ffb3b1",
                        "primary-fixed": "#ffdad8",
                        "surface-container-low": "#f0f3ff",
                        "on-secondary-fixed": "#001e2e",
                        "surface-container-highest": "#d5e3ff",
                        "secondary-fixed-dim": "#98cdf2",
                        "on-surface": "#001b3c",
                        "on-surface-variant": "#5b403f",
                        "inverse-primary": "#ffb3b1",
                        "on-tertiary-container": "#f2ffff",
                        "outline-variant": "#e4bebc",
                        "secondary": "#2b6485",
                        "surface-container-high": "#dee8ff",
                        "secondary-fixed": "#c7e7ff",
                        "surface-dim": "#c8dbff",
                        "outline": "#8f6f6e",
                        "surface": "#f9f9ff",
                        "surface-bright": "#f9f9ff",
                        "surface-container": "#e7eeff",
                        "on-primary-fixed": "#410007",
                        "inverse-surface": "#183153",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#b9ecee",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#fffbff",
                        "on-secondary-fixed-variant": "#064c6b",
                        "on-error": "#ffffff",
                        "on-secondary-container": "#255f80",
                        "on-secondary": "#ffffff",
                        "background": "#f9f9ff",
                        "on-error-container": "#93000a",
                        "primary": "#b7102a",
                        "on-background": "#001b3c",
                        "surface-tint": "#bb152c",
                        "on-primary-fixed-variant": "#92001c",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#4c7c7f",
                        "inverse-on-surface": "#ecf1ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "sm": "8px",
                        "margin-desktop": "40px",
                        "md": "16px",
                        "xl": "32px",
                        "lg": "24px",
                        "margin-mobile": "20px",
                        "xs": "4px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "button": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "headline-lg-mobile": ["26px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "button": ["16px", {"lineHeight": "20px", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
                    }
                },
            },
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface selection:bg-secondary-container">
<!-- TopAppBar Shell -->
<header class="fixed top-0 w-full z-50 shadow-sm bg-surface dark:bg-surface-dim flex justify-between items-center px-margin-mobile h-16">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim text-headline-md">bloodtype</span>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim tracking-tight">LifeStream</h1>
</div>
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-high dark:hover:bg-on-surface-variant/10 p-2 rounded-full transition-all duration-200">notifications</button>
<div class="hidden md:flex gap-6 font-label-md text-label-md">
<a class="text-on-surface-variant" href="#">Emergency</a>
<a class="text-on-surface-variant" href="#">Donors</a>
<a class="text-primary border-b-2 border-primary" href="#">Map View</a>
</div>
</div>
</header>
<!-- Main Content: Full Screen Map Canvas -->
<main class="relative h-screen w-full pt-16 pb-20 overflow-hidden">
<!-- Mock Map Background -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-surface-container relative">
<!-- Using a high-quality placeholder map texture/image -->
<img class="w-full h-full object-cover opacity-60 mix-blend-multiply" data-alt="A clean, minimalist topographical map illustration of a modern urban city district. The map uses a light mode aesthetic with soft whites, pale grays, and powder blue accents for parks and water bodies. The perspective is a top-down architectural view, conveying professional clarity and calm urgency. The lighting is bright and even, reinforcing a sterile, medical-grade utility environment." data-location="Metropolis" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCvuxNJ1mYpYbheE42akjj04jf09snoZODmP6RR-nxn3jM9NMjixTfh_wh-V8-B3Y0yz_oKz-MQD-iVHRs7nPO73Gby3OZZ9z5-OWHJ3fRjilV5TpU9G2DouZobNliuOJl7mbtyaHYcgTgvD-jqtqcpUJT5lW_FSoZQjA21tHueYIRIJLlhXiYliBwA5FvUbmNpt1a3pvHkoYokhI7Nu83Ld7Cvg9i31BeqXKaJ5rVivCVq5-rMUDIN7_1SPdNw6MmFqC7KvK6lRpU">
<!-- Overlay Grids for Map Look -->
<div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(circle, #8f6f6e 1px, transparent 1px); background-size: 40px 40px;"></div>
<!-- Map Pins (Manual Placement for visual UI demo) -->
<!-- Urgent Request 1 -->
<button class="absolute top-1/4 left-1/3 group cursor-pointer transition-transform active:scale-90 z-10" onclick="openSheet('St. Mary Hospital', 'Urgent: O- Required', 'primary', 'bloodtype')">
<div class="relative flex flex-col items-center">
<div class="bg-primary text-on-primary p-2 rounded-full shadow-lg animate-pin">
<span class="material-symbols-outlined filled-icon">bloodtype</span>
</div>
<div class="mt-1 px-2 py-0.5 bg-white shadow-md rounded-lg text-label-md font-label-md text-primary border border-primary-fixed whitespace-nowrap">O- Urgent</div>
<div class="w-1 h-2 bg-primary"></div>
</div>
</button>
<!-- Urgent Request 2 -->
<button class="absolute top-1/2 left-2/3 group cursor-pointer transition-transform active:scale-90 z-10" onclick="openSheet('City Medical Center', 'Urgent: AB+ Required', 'primary', 'bloodtype')">
<div class="relative flex flex-col items-center">
<div class="bg-primary text-on-primary p-2 rounded-full shadow-lg animate-pin" style="animation-delay: 0.5s">
<span class="material-symbols-outlined filled-icon">bloodtype</span>
</div>
<div class="mt-1 px-2 py-0.5 bg-white shadow-md rounded-lg text-label-md font-label-md text-primary border border-primary-fixed whitespace-nowrap">AB+ Critical</div>
<div class="w-1 h-2 bg-primary"></div>
</div>
</button>
<!-- Donation Center 1 -->
<button class="absolute bottom-1/3 left-1/4 group cursor-pointer transition-transform active:scale-90 z-10" onclick="openSheet('Red Cross Station Alpha', 'Donation Center • Open until 8 PM', 'secondary', 'location_on')">
<div class="relative flex flex-col items-center">
<div class="bg-secondary text-on-secondary p-2 rounded-full shadow-lg hover:bg-on-secondary-fixed-variant transition-colors">
<span class="material-symbols-outlined filled-icon">location_on</span>
</div>
<div class="mt-1 px-2 py-0.5 bg-white shadow-md rounded-lg text-label-md font-label-md text-secondary border border-secondary-container whitespace-nowrap">RC Station</div>
<div class="w-1 h-2 bg-secondary"></div>
</div>
</button>
<!-- Donation Center 2 -->
<button class="absolute top-1/3 right-1/4 group cursor-pointer transition-transform active:scale-90 z-10" onclick="openSheet('Community Health Hub', 'Donation Center • Walk-ins Welcome', 'secondary', 'location_on')">
<div class="relative flex flex-col items-center">
<div class="bg-secondary text-on-secondary p-2 rounded-full shadow-lg hover:bg-on-secondary-fixed-variant transition-colors">
<span class="material-symbols-outlined filled-icon">location_on</span>
</div>
<div class="mt-1 px-2 py-0.5 bg-white shadow-md rounded-lg text-label-md font-label-md text-secondary border border-secondary-container whitespace-nowrap">Health Hub</div>
<div class="w-1 h-2 bg-secondary"></div>
</div>
</button>
</div>
</div>
<!-- Floating UI Over Map -->
<div class="absolute top-4 left-4 right-4 z-20 flex flex-col gap-3 pointer-events-none">
<div class="bg-surface/90 backdrop-blur-md rounded-xl shadow-lg p-2 flex items-center gap-2 border border-outline-variant/30 pointer-events-auto max-w-md mx-auto w-full">
<span class="material-symbols-outlined text-on-surface-variant px-2">search</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-body-md font-body-md text-on-surface" placeholder="Search hospitals or centers..." type="text">
<button class="bg-surface-container-high p-2 rounded-lg text-on-surface-variant material-symbols-outlined">tune</button>
</div>
<div class="flex gap-2 justify-center pointer-events-auto">
<button class="bg-surface text-primary shadow-sm px-4 py-2 rounded-full text-label-md font-label-md border border-outline-variant flex items-center gap-2 active:scale-95 transition-transform">
<span class="w-2 h-2 rounded-full bg-primary"></span> Urgent Needs
                </button>
<button class="bg-surface text-secondary shadow-sm px-4 py-2 rounded-full text-label-md font-label-md border border-outline-variant flex items-center gap-2 active:scale-95 transition-transform">
<span class="w-2 h-2 rounded-full bg-secondary"></span> Donation Centers
                </button>
</div>
</div>
<button class="absolute bottom-24 right-4 z-20 bg-surface text-on-surface p-4 rounded-full shadow-lg border border-outline-variant active:scale-90 transition-transform flex items-center justify-center">
<span class="material-symbols-outlined">my_location</span>
</button>
<!-- Bottom Sheet (Details Overlay) -->
<div class="fixed bottom-0 left-0 w-full z-40 bg-surface rounded-t-3xl shadow-[0px_-8px_24px_rgba(29,53,87,0.1)] border-t border-outline-variant sheet-hidden" id="bottom-sheet">
<div class="flex flex-col p-6 pb-24 max-w-2xl mx-auto">
<!-- Handle -->
<div class="w-12 h-1.5 bg-outline-variant rounded-full mx-auto mb-6"></div>
<div class="flex items-start justify-between mb-4">
<div class="flex gap-4">
<div class="p-3 rounded-2xl flex items-center justify-center" id="sheet-icon-bg">
<span class="material-symbols-outlined filled-icon text-white text-3xl" id="sheet-icon">bloodtype</span>
</div>
<div>
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-1" id="sheet-title">St. Mary Hospital</h2>
<p class="font-body-md text-body-md text-on-surface-variant" id="sheet-subtitle">Urgent: O- Required • 0.8 miles away</p>
</div>
</div>
<button class="text-on-surface-variant p-2" onclick="closeSheet()">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Stats/Details Grid -->
<div class="grid grid-cols-2 gap-4 mb-8">
<div class="bg-surface-container rounded-xl p-4 flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Status</span>
<span class="font-body-lg text-body-lg text-primary font-bold">Critical Shortage</span>
</div>
<div class="bg-surface-container rounded-xl p-4 flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Estimated Time</span>
<span class="font-body-lg text-body-lg text-secondary font-bold">12 min drive</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex gap-4">
<button class="flex-1 py-4 rounded-xl font-button text-button transition-all duration-200 active:scale-95 shadow-md flex items-center justify-center gap-2" id="sheet-primary-btn">
<span class="material-symbols-outlined">navigation</span> Directions
                    </button>
<button class="flex-1 border-2 border-outline-variant text-on-surface py-4 rounded-xl font-button text-button transition-all duration-200 active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">calendar_month</span> Schedule
                    </button>
</div>
</div>
</div>
</main>
<!-- BottomNavBar Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-surface dark:bg-surface-dim flex justify-around items-center h-20 px-2 pb-safe shadow-[0px_-4px_12px_rgba(29,53,87,0.05)]">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1 hover:bg-surface-container-low dark:hover:bg-on-surface-variant/5 active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-on-secondary-fixed-variant text-on-secondary-container dark:text-secondary-fixed rounded-xl px-4 py-1 active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined filled-icon">map</span>
<span class="font-label-md text-label-md">Map</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1 hover:bg-surface-container-low dark:hover:bg-on-surface-variant/5 active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined">calendar_month</span>
<span class="font-label-md text-label-md">Schedule</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1 hover:bg-surface-container-low dark:hover:bg-on-surface-variant/5 active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-md text-label-md">Profile</span>
</a>
</nav>
<script>
        const sheet = document.getElementById('bottom-sheet');
        const sheetTitle = document.getElementById('sheet-title');
        const sheetSubtitle = document.getElementById('sheet-subtitle');
        const sheetIcon = document.getElementById('sheet-icon');
        const sheetIconBg = document.getElementById('sheet-icon-bg');
        const primaryBtn = document.getElementById('sheet-primary-btn');

        function openSheet(title, subtitle, type, icon) {
            sheetTitle.innerText = title;
            sheetSubtitle.innerText = subtitle;
            sheetIcon.innerText = icon;
            
            if (type === 'primary') {
                sheetIconBg.className = 'p-3 rounded-2xl flex items-center justify-center bg-primary shadow-lg';
                primaryBtn.className = 'flex-1 py-4 rounded-xl font-button text-button transition-all duration-200 active:scale-95 shadow-md flex items-center justify-center gap-2 bg-primary text-on-primary';
            } else {
                sheetIconBg.className = 'p-3 rounded-2xl flex items-center justify-center bg-secondary shadow-lg';
                primaryBtn.className = 'flex-1 py-4 rounded-xl font-button text-button transition-all duration-200 active:scale-95 shadow-md flex items-center justify-center gap-2 bg-secondary text-on-secondary';
            }

            sheet.classList.remove('sheet-hidden');
            sheet.classList.add('sheet-visible');
        }

        function closeSheet() {
            sheet.classList.add('sheet-hidden');
            sheet.classList.remove('sheet-visible');
        }

        // Close sheet when tapping on the map (outside UI)
        document.querySelector('.relative.h-screen').addEventListener('click', (e) => {
            if (e.target.closest('button')) return; // ignore if button clicked
            closeSheet();
        });

        // Prevention of event bubbling for internal sheet clicks
        sheet.addEventListener('click', (e) => e.stopPropagation());
    </script>
</body></html>
